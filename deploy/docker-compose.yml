# Static site in a small nginx container, bound to localhost only.
# Tailscale Serve publishes it to your tailnet (see scripts/deploy.sh).
services:
  web:
    image: nginx:1.27-alpine
    container_name: waypoints-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WAYPOINTS_PORT:-8096}:80"
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
