server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Behind Tailscale Serve: keep redirects relative so they don't point at port 80.
  absolute_redirect off;

  location / {
    try_files $uri $uri/ $uri.html =404;
  }

  # Astro's hashed assets never change.
  location /_astro/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  error_page 404 /404.html;
}
