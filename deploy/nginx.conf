server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Compress text (pages, JSON, scripts, styles); photos are already compressed.
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml text/calendar;

  # Behind Tailscale Serve: keep redirects relative so they don't point at port 80.
  absolute_redirect off;

  location / {
    try_files $uri $uri/ $uri.html =404;
  }

  # Astro's hashed assets never change.
  location /_astro/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Trip data changes with each build; let browsers reuse it briefly.
  location = /trips.json {
    add_header Cache-Control "public, max-age=300";
  }

  # Sync between your devices and your own calendar feed (deploy/sync/server.mjs). The name is
  # looked up per request, so the site still starts if the sync container is down.
  location /api/ {
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $sync_server http://sync:8080;
    proxy_pass $sync_server;
    client_max_body_size 300k;
  }

  # Event calendar feed, rebuilt daily; calendar apps poll it.
  location = /calendar.ics {
    types { text/calendar ics; }
    charset utf-8;
    charset_types text/calendar;
    add_header Cache-Control "public, max-age=3600";
  }

  # Photos downloaded from Commons; a new photo gets a new file name.
  location /photos/commons/ {
    expires 30d;
  }

  error_page 404 /404.html;
}
